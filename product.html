<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comic Reel & Retro product listing.">
  <title>Comic Reel & Retro | Product</title>
  <link rel="stylesheet" href="style.css">

  <style>
    .product-detail-page {
      min-height: 100vh;
      padding: 190px 6vw 80px;
      background: #0d0d0d;
    }

    .product-detail {
      max-width: 1180px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(360px, 520px) 1fr;
      gap: 70px;
      align-items: start;
    }

    .product-detail-image {
      background: #17181c;
      border: 1px solid #333;
      min-height: 650px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 22px;
      box-sizing: border-box;
    }

    .product-detail-image img {
      display: block;
      max-width: 100%;
      max-height: 700px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .product-photo-placeholder {
      width: 100%;
      min-height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #292c32;
      color: white;
      font-size: 30px;
      font-weight: 800;
    }

    .product-detail-info h1 {
      margin: 0 0 14px;
      font-size: clamp(42px, 5vw, 72px);
      line-height: .95;
      color: #fff;
    }

    .product-detail-meta {
      color: #9fa4ad;
      font-size: 16px;
      margin-bottom: 24px;
    }

    .product-detail-price {
      color: #fff;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 28px;
    }

    .product-detail-button {
      border: 0;
      background: #df4035;
      color: #fff;
      font-weight: 800;
      padding: 16px 34px;
      cursor: pointer;
      margin-bottom: 38px;
    }

    .product-detail-button:hover {
      filter: brightness(1.08);
    }

    .detail-section {
      border-top: 1px solid #303030;
      padding: 24px 0;
    }

    .detail-section h2 {
      margin: 0 0 10px;
      color: #fff;
      font-size: 18px;
    }

    .detail-section p {
      margin: 6px 0;
      color: #aeb2ba;
      line-height: 1.6;
    }

    .detail-section strong {
      color: #fff;
    }

    .product-not-found {
      max-width: 800px;
      margin: 0 auto;
      color: #fff;
      padding-top: 60px;
    }

    .product-not-found a {
      color: #fff;
    }

    @media (max-width: 850px) {
      .product-detail-page {
        padding: 150px 20px 50px;
      }

      .product-detail {
        grid-template-columns: 1fr;
        gap: 35px;
      }

      .product-detail-image {
        min-height: 0;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">
    <img src="images/logo.png" alt="Comic Reel & Retro">
  </a>

  <nav>
    <a href="index.html">Home</a>
    <a href="comics.html">Comics</a>
    <a href="posters.html">Posters</a>
    <a href="new-arrivals.html">New Arrivals</a>
    <a href="sell-to-us.html">Sell To Us</a>
    <a href="about.html">About</a>
  </nav>

  <button class="cart-button" id="cartButton">
    Bag <span id="cartCount">0</span>
  </button>
</header>

<main class="product-detail-page">
  <section id="productPage"></section>
</main>

<div class="cart-panel" id="cartPanel">
  <div class="cart-top">
    <h3>Your bag</h3>
    <button id="closeCart">×</button>
  </div>

  <div id="cartItems"></div>

  <div class="cart-bottom">
    <div>
      <span>Total</span>
      <strong id="cartTotal">£0.00</strong>
    </div>
    <button class="btn dark" id="checkout">Checkout</button>
    <p class="tiny">Checkout will be connected to your chosen payment platform later.</p>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<footer>
  <div class="logo">COMIC <span>REEL</span> & RETRO</div>
  <p>Posters • Comics • Pop Culture</p>
  <p>hello@comicreelretro.co.uk</p>
</footer>

<script src="script.js"></script>
</body>
</html>
